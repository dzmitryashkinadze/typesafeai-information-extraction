[project]
name = "typesafeai-information-extraction-demo"
version = "0.1.0"
description = "Conventional clinical-note extraction with MedSpaCy and FHIR R4B output"
readme = "README.md"
authors = [
    { name = "Dzmitry Ashkinadze", email = "dzmitry.ashkinadze@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "medspacy==1.3.1",
    "spacy==3.8.2",
    "en-core-web-sm==3.8.0",
    "fhir-resources==8.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
typesafeai-information-extraction-demo = "typesafeai_information_extraction_demo.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
